<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="50%" stop-color="#161e2b" />
      <stop offset="100%" stop-color="#0b0f15" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Radiating Rings from Agent Core -->
  <circle cx="400" cy="240" r="140" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="6 6" stroke-width="1.5" />
  <circle cx="400" cy="240" r="190" stroke="#94a3b8" stroke-opacity="0.1" stroke-dasharray="4 4" stroke-width="1" />

  <!-- Data Flow Synapses -->
  <!-- LinkedIn Connection -->
  <path d="M 230 160 Q 300 200 400 240" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 4" />
  <!-- Twitter/X Connection -->
  <path d="M 570 160 Q 500 200 400 240" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 4" />
  <!-- Reddit Connection -->
  <path d="M 400 370 L 400 240" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 4" />

  <!-- Center AI Agent Node -->
  <circle cx="400" cy="240" r="54" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
  <circle cx="400" cy="240" r="44" fill="url(#coreGrad)" opacity="0.2" />

  <!-- AI Brain / Agent Icon -->
  <g transform="translate(378, 218) scale(1.1)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="2" y="5" width="36" height="28" rx="6" />
    <path d="M 12 14 L 12 18" />
    <path d="M 28 14 L 28 18" />
    <path d="M 14 25 Q 20 29 26 25" />
    <circle cx="20" cy="1" r="2.5" fill="#38bdf8" />
    <line x1="20" y1="3.5" x2="20" y2="5" />
  </g>

  <!-- Left Node: LinkedIn Aggregation -->
  <g transform="translate(230, 160)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" />
    <text x="0" y="8" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="20" text-anchor="middle">in</text>
    <rect x="-45" y="42" width="90" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="57" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">LinkedIn Feed</text>
  </g>

  <!-- Right Node: X / Twitter Trends -->
  <g transform="translate(570, 160)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
    <text x="0" y="8" fill="#ffffff" font-family="Inter, sans-serif" font-weight="800" font-size="18" text-anchor="middle">𝕏</text>
    <rect x="-45" y="42" width="90" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="57" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Trending Pulse</text>
  </g>

  <!-- Bottom Node: Reddit Discussions -->
  <g transform="translate(400, 370)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#f97316" stroke-width="2" />
    <text x="0" y="8" fill="#fb923c" font-family="Inter, sans-serif" font-weight="800" font-size="16" text-anchor="middle">r/</text>
    <rect x="-55" y="40" width="110" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="55" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Subreddit Intel</text>
  </g>

  <!-- Header Badge & Status -->
  <rect x="32" y="32" width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="48" cy="47" r="4" fill="#10b981" />
  <text x="60" y="52" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em">AUTONOMOUS AGENT</text>

  <rect x="588" y="32" width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="678" y="52" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">RAG &amp; LLM SYNTHESIS</text>

  <!-- Bottom Caption -->
  <text x="400" y="475" fill="#64748b" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.04em">
    CONTENT HARVESTING • SENTIMENT ANALYSIS • DRAFT GENERATION
  </text>
</svg>
