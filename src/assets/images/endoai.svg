<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradEndo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017" />
      <stop offset="50%" stop-color="#111c27" />
      <stop offset="100%" stop-color="#080e14" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="endoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradEndo)" />

  <!-- Subtle Medical Grid -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Top Badges -->
  <rect x="32" y="32" width="200" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="48" cy="47" r="4" fill="#06b6d4" />
  <text x="60" y="52" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em">MEDICAL COMPUTER VISION</text>

  <rect x="568" y="32" width="200" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="668" y="52" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PYTORCH • ViT • RESNET50</text>

  <!-- Central Medical Imaging Aperture / Endoscopic Scope View -->
  <circle cx="400" cy="245" r="140" fill="url(#lensGrad)" stroke="#1e293b" stroke-width="3" />
  <circle cx="400" cy="245" r="130" fill="none" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="400" cy="245" r="90" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />

  <!-- Vision Transformer Attention Map Grid (Tissue Cells & Heatmap overlay) -->
  <g transform="translate(325, 170)" opacity="0.85">
    <!-- Attention Grid Blocks -->
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <rect x="40" y="0" width="34" height="34" rx="6" fill="#06b6d4" opacity="0.6" stroke="#22d3ee" stroke-width="1" />
    <rect x="80" y="0" width="34" height="34" rx="6" fill="#f43f5e" opacity="0.75" stroke="#fb7185" stroke-width="1.5" filter="url(#endoGlow)" />
    <rect x="120" y="0" width="34" height="34" rx="6" fill="#0284c7" opacity="0.4" stroke="#38bdf8" stroke-width="1" />

    <rect x="0" y="40" width="34" height="34" rx="6" fill="#06b6d4" opacity="0.5" stroke="#22d3ee" stroke-width="1" />
    <rect x="40" y="40" width="34" height="34" rx="6" fill="#f43f5e" opacity="0.85" stroke="#fb7185" stroke-width="1.5" filter="url(#endoGlow)" />
    <rect x="80" y="40" width="34" height="34" rx="6" fill="#fb923c" opacity="0.8" stroke="#fdba74" stroke-width="1" />
    <rect x="120" y="40" width="34" height="34" rx="6" fill="#0284c7" opacity="0.35" stroke="#38bdf8" stroke-width="1" />

    <rect x="0" y="80" width="34" height="34" rx="6" fill="#0284c7" opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <rect x="40" y="80" width="34" height="34" rx="6" fill="#06b6d4" opacity="0.65" stroke="#22d3ee" stroke-width="1" />
    <rect x="80" y="80" width="34" height="34" rx="6" fill="#0284c7" opacity="0.5" stroke="#38bdf8" stroke-width="1" />
    <rect x="120" y="80" width="34" height="34" rx="6" fill="#0f172a" opacity="0.5" stroke="#334155" stroke-width="1" />

    <rect x="0" y="120" width="34" height="34" rx="6" fill="#0f172a" opacity="0.5" stroke="#334155" stroke-width="1" />
    <rect x="40" y="120" width="34" height="34" rx="6" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <rect x="80" y="120" width="34" height="34" rx="6" fill="#0f172a" opacity="0.5" stroke="#334155" stroke-width="1" />
    <rect x="120" y="120" width="34" height="34" rx="6" fill="#0f172a" opacity="0.5" stroke="#334155" stroke-width="1" />
  </g>

  <!-- AI Diagnostic Detection Box -->
  <g transform="translate(360, 165)">
    <rect x="0" y="0" width="85" height="85" rx="8" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4" />
    <!-- Corner crosshairs -->
    <path d="M -4 12 L -4 -4 L 12 -4" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    <path d="M 73 -4 L 89 -4 L 89 12" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    <path d="M -4 73 L -4 89 L 12 89" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    <path d="M 73 89 L 89 89 L 89 73" stroke="#f43f5e" stroke-width="2.5" fill="none" />
    
    <!-- Tag Label -->
    <rect x="0" y="-22" width="105" height="18" rx="4" fill="#f43f5e" />
    <text x="52" y="-9" fill="#ffffff" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">IBD DETECTED: 98.4%</text>
  </g>

  <!-- Neural Net Feature Extraction Conduits (Left side: ResNet CNN) -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="115" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="57" y="28" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ResNet-50</text>
    <text x="57" y="48" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Deep Residual CNN</text>
    <rect x="15" y="58" width="85" height="16" rx="8" fill="#0f172a" />
    <text x="57" y="70" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Feature Extractor</text>
  </g>
  <path d="M 215 245 Q 260 245 285 245" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <!-- Neural Net Feature Extraction Conduits (Right side: ViT Transformer) -->
  <g transform="translate(585, 200)">
    <rect x="0" y="0" width="125" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="62" y="28" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Vision Transformer</text>
    <text x="62" y="48" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Self-Attention ViT</text>
    <rect x="15" y="58" width="95" height="16" rx="8" fill="#0f172a" />
    <text x="62" y="70" fill="#a855f7" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Global Patch Context</text>
  </g>
  <path d="M 515 245 Q 550 245 585 245" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <!-- Bottom Metric Bar -->
  <g transform="translate(180, 420)">
    <rect x="0" y="0" width="440" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="220" y="24" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.04em">
      ENDOSCOPIC IMAGING • TRANSFER LEARNING • HIGH AUC-ROC
    </text>
  </g>
</svg>

