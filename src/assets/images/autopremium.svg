<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradAuto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844fba" />
      <stop offset="100%" stop-color="#5c2d91" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradAuto)" />

  <!-- Cloud Infrastructure Mesh -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Top Badges -->
  <rect x="32" y="32" width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="48" cy="47" r="4" fill="#a855f7" />
  <text x="60" y="52" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em">TERRAFORM IaC</text>

  <rect x="588" y="32" width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="678" y="52" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AWS CLOUD INFRA</text>

  <!-- Sleek Automotive Silhouette Outline (Automobile Catalogue) -->
  <g transform="translate(140, 180) scale(1.05)" filter="url(#carGlow)">
    <!-- Aerodynamic Luxury Car Contours -->
    <path d="M 40 120 C 70 120, 100 115, 120 100 C 150 78, 180 50, 240 45 C 310 40, 360 65, 410 90 C 440 105, 470 115, 500 120 L 490 135 C 470 138, 450 142, 420 142 L 390 142 C 380 125, 360 112, 335 112 C 310 112, 290 125, 280 142 L 180 142 C 170 125, 150 112, 125 112 C 100 112, 80 125, 70 142 L 30 142 C 20 138, 25 125, 40 120 Z" 
          fill="none" stroke="url(#carGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Wheels -->
    <circle cx="125" cy="135" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="125" cy="135" r="8" fill="#38bdf8" />
    <circle cx="335" cy="135" r="22" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
    <circle cx="335" cy="135" r="8" fill="#c084fc" />

    <!-- Window outline -->
    <path d="M 180 75 C 200 60, 240 52, 290 52 C 325 52, 355 65, 380 85 L 200 85 Z" fill="#1e293b" opacity="0.6" stroke="#94a3b8" stroke-width="1.2" />
  </g>

  <!-- Terraform Floating Architecture Modules -->
  <!-- Module 1: VPC Network -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="110" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="55" y="26" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">VPC &amp; Subnets</text>
  </g>

  <!-- Module 2: Terraform Core Engine -->
  <g transform="translate(360, 80)">
    <rect x="0" y="0" width="130" height="48" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="2" />
    <!-- Terraform Hex/Isometric Logo mark -->
    <path d="M 22 14 L 32 8 L 32 20 L 22 26 Z" fill="#844fba" />
    <path d="M 34 8 L 44 14 L 44 26 L 34 20 Z" fill="#6c3da8" />
    <path d="M 34 22 L 44 28 L 44 40 L 34 34 Z" fill="#5c2d91" />
    <text x="54" y="29" fill="#f3e8ff" font-family="Inter, sans-serif" font-size="12" font-weight="700">Terraform</text>
  </g>

  <!-- Module 3: Docker & ECS -->
  <g transform="translate(600, 110)">
    <rect x="0" y="0" width="120" height="42" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
    <text x="60" y="26" fill="#bae6fd" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Containers / ECS</text>
  </g>

  <!-- Connecting IaC Pipings -->
  <path d="M 210 130 Q 285 104 360 104" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
  <path d="M 490 104 Q 545 104 600 130" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />

  <!-- Bottom Architecture Metrics -->
  <g transform="translate(200, 410)">
    <rect x="0" y="0" width="400" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="200" y="24" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.04em">
      AWS VPC • ECS CLUSTERS • RDS • DOCUMENTATION WORKFLOWS
    </text>
  </g>
</svg>
